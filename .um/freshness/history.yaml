schemaVersion: 1
description: Review existing discussions for proposed catalog corrections.
inputs:
  packet:
    kind: text
environmentPassthrough:
  - ANTHROPIC_API_KEY
agentProfiles:
  auditor:
    harness:
      kind: claude_code
      config:
        model: claude-sonnet-5
        effort: medium
steps:
  assess:
    kind: agent
    agent:
      profile: auditor
      systemPrompt: prompts/history.md
      message:
        text:
          - file: schemas/history.json
          - ref: inputs.packet
    outputs:
      assessment:
        kind: json
        from: agent_result
        schema: schemas/history.json
exports:
  assessment:
    ref: outputs.assess.assessment
