schemaVersion: 1
description: Investigate catalog freshness, review history, validate corrections and produce a preview.
inputs:
  slice:
    kind: text
environmentPassthrough:
  - ANTHROPIC_API_KEY
  - FRESHNESS_GITHUB_TOKEN
  - FRESHNESS_REPOSITORY
agentProfiles:
  auditor:
    harness:
      kind: claude_code
      config:
        model: claude-sonnet-5
        effort: medium
steps:
  prepareCatalog:
    kind: cmd
    inputs:
      slice:
        ref: inputs.slice
    command:
      argv: [python3, .um/freshness/scripts/stages.py, prepare]
    outputs:
      catalog:
        kind: text
        from: path
        path: .um/freshness/work/catalog.json
  investigateEntries:
    kind: agent
    agent:
      profile: auditor
      systemPrompt: prompts/auditor.md
      message:
        text:
          - file: schemas/assessment.json
          - ref: outputs.prepareCatalog.catalog
    outputs:
      assessment:
        kind: json
        from: agent_result
        schema: schemas/assessment.json
  collectHistory:
    kind: cmd
    inputs:
      catalog:
        ref: outputs.prepareCatalog.catalog
      assessment:
        ref: outputs.investigateEntries.assessment
    command:
      argv: [python3, .um/freshness/scripts/stages.py, collectHistory]
    outputs:
      history:
        kind: text
        from: path
        path: .um/freshness/work/history.json
  reviewHistory:
    kind: agent
    agent:
      profile: auditor
      systemPrompt: prompts/history.md
      message:
        text:
          - file: schemas/history.json
          - ref: outputs.collectHistory.history
    outputs:
      review:
        kind: json
        from: agent_result
        schema: schemas/history.json
  buildCorrections:
    kind: cmd
    inputs:
      catalog:
        ref: outputs.prepareCatalog.catalog
      assessment:
        ref: outputs.investigateEntries.assessment
      history:
        ref: outputs.collectHistory.history
      review:
        ref: outputs.reviewHistory.review
    command:
      argv: [python3, .um/freshness/scripts/stages.py, buildCorrections]
    outputs:
      corrections:
        kind: json
        from: path
        path: .um/freshness/work/corrections.json
        schema: schemas/corrections.json
  validateCorrections:
    kind: cmd
    inputs:
      corrections:
        ref: outputs.buildCorrections.corrections
    command:
      argv: [python3, .um/freshness/scripts/stages.py, validateCorrections]
    outputs:
      validated:
        kind: json
        from: path
        path: .um/freshness/work/validated.json
        schema: schemas/validated.json
  renderPreview:
    kind: cmd
    inputs:
      validated:
        ref: outputs.validateCorrections.validated
    command:
      argv: [python3, .um/freshness/scripts/stages.py, renderPreview]
    outputs:
      report:
        kind: text
        from: path
        path: .um/freshness/work/preview/report.md
      proposals:
        kind: file
        from: path
        path: .um/freshness/work/proposals.zip
        mediaType: application/zip
exports:
  report:
    ref: outputs.renderPreview.report
  proposals:
    ref: outputs.renderPreview.proposals
