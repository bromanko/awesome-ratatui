name: Check UM freshness integration
on:
  pull_request:
    paths: ['.um/freshness/**', '.github/workflows/um-freshness*.yml']
  push:
    branches: [main]
    paths: ['.um/freshness/**', '.github/workflows/um-freshness*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline checks
        run: python3 -m unittest discover -s .um/freshness/tests -v
      - name: Render example preview
        run: |
          python3 .um/freshness/tests/preview_example.py "$RUNNER_TEMP/freshness-example"
          cat "$RUNNER_TEMP/freshness-example/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save example proposals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: freshness-example
          path: ${{ runner.temp }}/freshness-example/
          retention-days: 14
