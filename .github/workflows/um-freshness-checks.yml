name: Check UM freshness integration
on:
  pull_request:
    paths: ['.um/freshness/**', '.github/workflows/um-freshness*.yml']
  push:
    paths: ['.um/freshness/**', '.github/workflows/um-freshness*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        scenario: [correction, keep, unchanged]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline checks
        run: python3 -m unittest discover -s .um/freshness/tests -v
      - name: Install validation tools
        run: bash .um/freshness/checks/install.sh
      - name: Exercise real validation tools
        run: python3 .um/freshness/tests/check_tools.py
      - name: Prepare UM graph integration test
        run: python3 .um/freshness/tests/workflow_fixture.py generate ${{ matrix.scenario }}
      - name: Exercise conditional UM graph
        id: graph
        uses: useful-machinery/run-action@3b5d29379bc349df8d95b29b599e71701aa1d017
        with:
          um-version: 0.72.1
          workflow: .um/freshness/workflow-test.yaml
          source-root: .um/freshness
          execution-root: ${{ github.workspace }}
          inputs: '{"slice":{"kind":"text","value":"0"}}'
      - name: Verify UM exports
        run: |
          test -s .um/freshness/work/preview/report.md
          test -s .um/freshness/work/preview/baseline.json
          python3 -m zipfile -t .um/freshness/work/proposals.zip
      - name: Render review preview
        run: |
          python3 .um/freshness/tests/preview_example.py "$RUNNER_TEMP/freshness-example"
          if [ "${{ matrix.scenario }}" = correction ] && [ -f .um/freshness/live-review/report.md ]; then
            cat .um/freshness/live-review/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/freshness-example/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save example proposals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: freshness-example-${{ matrix.scenario }}
          path: ${{ runner.temp }}/freshness-example/
          retention-days: 14
      - name: Save retained live review
        if: matrix.scenario == 'correction' && hashFiles('.um/freshness/live-review/report.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: freshness-live-review
          path: .um/freshness/live-review/
          include-hidden-files: true
          retention-days: 14
